<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="منوی دیجیتال کافه هوژین"
    >

    <title>HOZHIN CAFE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-label="باز کردن منو"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <div class="header-brand">
            HOZHIN
        </div>


        <button
            class="cart-button"
            id="cartButton"
            type="button"
            aria-label="سبد سفارش"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 7H6"/>
                <circle cx="10" cy="20" r="1"/>
                <circle cx="18" cy="20" r="1"/>
            </svg>

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </button>

    </header>



    <!-- =========================
         SIDE MENU
    ========================== -->

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >

        <div class="side-menu-header">

            <strong>HOZHIN</strong>

            <button
                id="closeSideMenu"
                type="button"
                aria-label="بستن منو"
            >
                ×
            </button>

        </div>


        <div class="side-menu-content">

            <button
                class="side-menu-item"
                id="languageButton"
                type="button"
            >
                <span>زبان</span>
                <strong id="languageLabel">فارسی</strong>
            </button>


            <button
                class="side-menu-item"
                id="themeButton"
                type="button"
            >
                <span>تم سایت</span>
                <strong>مشکی / طلایی</strong>
            </button>

        </div>

    </aside>


    <div
        class="side-menu-overlay"
        id="sideMenuOverlay"
    ></div>



    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <!-- =========================
             HOME PAGE
        ========================== -->

        <section
            class="page home-page active"
            id="homePage"
        >

            <div class="home-container">


                <!-- LOGO -->

                <div class="home-logo">

                    <div class="logo-image-container">

                        <img
                            src="images/logo.png"
                            alt="HOZHIN Cafe Logo"
                            class="logo-image"
                        >

                    </div>


                    <h1 class="logo-title">
                        HOZHIN
                    </h1>


                    <p class="logo-subtitle">
                        CAFE
                    </p>

                </div>



                <!-- CAFE INFORMATION -->

                <div class="cafe-information-icons">


                    <!-- PHONE -->

                    <button
                        class="information-icon-button"
                        type="button"
                        data-info="phone"
                        aria-label="تلفن"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M6.6 3.5 9.2 3c.7-.1 1.3.3 1.5 1l1 3c.2.5 0 1.1-.4 1.4l-1.8 1.2c1 2.1 2.7 3.8 4.8 4.8l1.2-1.8c.3-.4.9-.6 1.4-.4l3 1c.7.2 1.1.8 1 1.5l-.5 2.6c-.1.7-.7 1.2-1.4 1.2C11.3 18.5 5.5 12.7 4.9 6.1c-.1-.7.4-1.3 1.1-1.4Z"/>
                        </svg>

                    </button>



                    <!-- ADDRESS -->

                    <button
                        class="information-icon-button"
                        type="button"
                        data-info="address"
                        aria-label="آدرس"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M12 21s7-6.2 7-12A7 7 0 1 0 5 9c0 5.8 7 12 7 12Z"/>
                            <circle
                                cx="12"
                                cy="9"
                                r="2.3"
                            />
                        </svg>

                    </button>



                    <!-- INSTAGRAM -->

                    <button
                        class="information-icon-button"
                        type="button"
                        data-info="instagram"
                        aria-label="اینستاگرام"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="3"
                                width="18"
                                height="18"
                                rx="5"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="4"
                            />

                            <circle
                                cx="17.5"
                                cy="6.5"
                                r="1"
                            />

                        </svg>

                    </button>

                </div>



                <!-- INFORMATION POPUP -->

                <div
                    class="information-popup"
                    id="informationPopup"
                    aria-hidden="true"
                >

                    <div class="information-popup-card">

                        <button
                            class="information-popup-close"
                            id="informationPopupClose"
                            type="button"
                            aria-label="بستن"
                        >
                            ×
                        </button>


                        <div
                            class="information-popup-icon"
                            id="informationPopupIcon"
                        ></div>


                        <p
                            class="information-popup-label"
                            id="informationPopupLabel"
                        ></p>


                        <strong
                            class="information-popup-value"
                            id="informationPopupValue"
                        ></strong>


                        <a
                            class="information-popup-action"
                            id="informationPopupAction"
                            href="#"
                        ></a>

                    </div>

                </div>



                <!-- SHOW MENU BUTTON -->

                <button
                    class="primary-button"
                    id="showMenuButton"
                    type="button"
                >
                    مشاهده منو
                </button>


            </div>

        </section>



        <!-- =========================
             MENU PAGE
        ========================== -->

        <section
            class="page menu-page"
            id="menuPage"
        >

            <div class="menu-container">


                <div class="menu-page-header">

                    <h2 id="menuTitle">
                        منوی HOZHIN
                    </h2>

                    <p id="menuSubtitle">
                        انتخاب کنید و سفارش دهید
                    </p>

                </div>



                <!-- CATEGORIES -->

                <div
                    class="category-list"
                    id="categoryList"
                >
                    <!-- JavaScript -->
                </div>



                <!-- PRODUCTS -->

                <div
                    class="products-grid"
                    id="productsGrid"
                >
                    <!-- JavaScript -->
                </div>

            </div>

        </section>

    </main>



    <!-- =========================
         PRODUCT DETAIL MODAL
    ========================== -->

    <div
        class="modal"
        id="productModal"
        aria-hidden="true"
    >

        <div class="modal-overlay"></div>


        <div class="product-modal-card">

            <button
                class="modal-close"
                id="productModalClose"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>


            <div class="product-detail-image">

                <img
                    id="productDetailImage"
                    src=""
                    alt=""
                >

            </div>


            <div class="product-detail-content">

                <span
                    class="product-detail-category"
                    id="productDetailCategory"
                ></span>


                <h2
                    id="productDetailName"
                ></h2>


                <p
                    id="productDetailDescription"
                ></p>


                <div class="product-detail-bottom">

                    <strong
                        id="productDetailPrice"
                    ></strong>


                    <div class="quantity-control">

                        <button
                            id="quantityMinus"
                            type="button"
                        >
                            −
                        </button>

                        <span
                            id="quantityValue"
                        >
                            1
                        </span>

                        <button
                            id="quantityPlus"
                            type="button"
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    class="primary-button"
                    id="addToCartButton"
                    type="button"
                >
                    افزودن به سفارش
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         CART MODAL
    ========================== -->

    <div
        class="modal"
        id="cartModal"
        aria-hidden="true"
    >

        <div class="modal-overlay"></div>


        <div class="cart-modal-card">

            <button
                class="modal-close"
                id="cartModalClose"
                type="button"
                aria-label="بستن"
            >
                ×
            </button>


            <div class="cart-header">

                <h2 id="cartTitle">
                    سفارش شما
                </h2>

            </div>


            <div
                class="cart-items"
                id="cartItems"
            >
                <!-- JavaScript -->
            </div>


            <div class="cart-footer">

                <div class="cart-total">

                    <span id="cartTotalLabel">
                        مبلغ کل
                    </span>

                    <strong id="cartTotal">
                        0
                    </strong>

                </div>


                <p
                    class="cart-notice"
                    id="cartNotice"
                >
                    سفارش شما پس از ثبت برای کافه ارسال می‌شود.
                </p>


                <button
                    class="primary-button"
                    id="submitOrderButton"
                    type="button"
                >
                    ثبت سفارش
                </button>


                <button
                    class="secondary-button"
                    id="clearCartButton"
                    type="button"
                >
                    خالی کردن سفارش
                </button>


                <div
                    class="order-result"
                    id="orderResult"
                ></div>

            </div>

        </div>

    </div>



    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>
</html>
